name: Build and verify calendar
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run verification
        shell: pwsh
        run: |
          python verify_all.py 2>&1 | Tee-Object -FilePath verify.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content verify.log -Tail 30) -join ' | '
            Write-Output "::error title=verify_all failed::$tail"
            exit $code
          }
      - run: python build_windows.py
      - name: Check packaged EXE and stage artifact
        shell: pwsh
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          $exe = Get-Item "dist/小日历-v$version.exe"
          foreach ($arguments in @('--smoke-test', '--smoke-test --safe-mode')) {
            $test = Start-Process -FilePath $exe.FullName -ArgumentList $arguments -WindowStyle Hidden -PassThru
            if (-not $test.WaitForExit(60000)) { Stop-Process -Id $test.Id; throw 'EXE check timed out' }
            if ($test.ExitCode -ne 0) { throw 'EXE check failed' }
          }
          Copy-Item -LiteralPath $exe.FullName -Destination "dist/little-calendar-windows-v$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/little-calendar-windows-*.exe
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pyqt6 fonts-noto-cjk
      - run: /usr/bin/python3 verify_all.py
      - run: /usr/bin/python3 build_ubuntu.py
      - name: Install and check Debian package
        run: |
          sudo apt-get install -y ./dist/*.deb
          QT_QPA_PLATFORM=offscreen little-calendar --smoke-test
          QT_QPA_PLATFORM=offscreen little-calendar --smoke-test --safe-mode
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: dist/*.deb
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate tag and write checksums
        run: |
          python3 tools/prepare_release.py "$GITHUB_REF_NAME"
      - name: Create draft release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.deb dist/SHA256SUMS.txt --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
